aid: otrium
name: Otrium
description: 'Otrium is an online designer fashion outlet, headquartered in Amsterdam,
  that connects shoppers across Europe with end-of-season and overstock apparel, footwear,
  and accessories from designer and premium brands at reduced prices. A Certified B
  Corporation, Otrium operates a curated marketplace model with dedicated brand storefronts,
  native iOS and Android apps, and multi-market localization across the Netherlands,
  Germany, Belgium, France, Italy, the United Kingdom, Spain, Poland, and the rest of
  Europe. It was surfaced in the API Evangelist network as a portfolio company of Bond
  Capital and Index Ventures. No public developer API, SDK, or documentation surface
  is currently published; this profile captures the company identity and its verified
  public web properties.'
